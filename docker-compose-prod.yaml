# Demo local, not a hardened production deployment.
name: product-api
services:
  mongo:
    image: mongo:8.0.17
    container_name: nammongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping:1}).ok !== 1) quit(1)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
  api:
    container_name: product-api
    image: ${PRODUCT_IMAGE:?Set PRODUCT_IMAGE to Docker Hub image with commit SHA or digest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGODB_URI: ${MONGODB_URI_CONTAINER:-mongodb://mongo:27017/productdb}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/health.js"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  mongo-data:
