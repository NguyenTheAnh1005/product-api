name: Product basic CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MONGOMS_DISABLE_POSTINSTALL: '1'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
